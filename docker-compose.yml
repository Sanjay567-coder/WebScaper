services:
  mysql:
    image: mysql:8.0
    container_name: webscraper_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-webscraper_db}
      MYSQL_USER: ${DB_USER:-scraper_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-scraper_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webscraper_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webscraper_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-webscraper_db}
      DB_USER: ${DB_USER:-scraper_user}
      DB_PASSWORD: ${DB_PASSWORD:-scraper_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - webscraper_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webscraper_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    ports:
      - "5173:5173"
    networks:
      - webscraper_net

volumes:
  mysql_data:
    driver: local

networks:
  webscraper_net:
    driver: bridge
